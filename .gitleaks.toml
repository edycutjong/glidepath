# gitleaks config — extends the default rules. The only allowlist: public on-chain token contract addresses.
# `token: "0x6982…"` in scripts/seed.ts trips the generic-api-key rule (the word "token" beside a 40-hex string);
# a contract address is public by definition. The Nansen key shape (nsn_…) can never match either pattern below.
[extend]
useDefault = true

[allowlist]
description = "Public token contract / mint addresses are not secrets"
regexTarget = "secret"
regexes = [
  '''^0x[0-9a-fA-F]{40}$''',
  '''^[1-9A-HJ-NP-Za-km-z]{32,44}$''',
]
