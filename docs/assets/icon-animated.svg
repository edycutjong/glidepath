<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512" role="img" aria-label="Glidepath — turns a bag you must sell into a dated selling calendar sized to organic demand; a red day halves that day's tranche">
<!-- STORYBOARD (dur 6s — must equal this file's single master dur)
  0-10%   steady state: the four bars as the favicon draws them (red 34 tall, green 26/18/10) — poster
  10-25%  trigger:      the green bars sink into the floor and the red bar grows to the full bag: sell it all today   data-story="beat-2"
  25-55%  mechanism:    One red dump bar splits into dated green tranches sized to organic demand; the red day's tranche halves.   data-story="beat-3"
  55-80%  resolution:   the flight holds; a green glow breathes under the bars                                       data-story="beat-4"
  80-100% breathe + seam fade: glow and red-day cell fade 90-97 %; the bars are already at their t=0 heights
-->
<style>
  @keyframes breathe { 0%,55% { opacity: 0 } 65% { opacity: .55 } 80% { opacity: .35 } 90% { opacity: .5 } 97%,100% { opacity: 0 } }
  [data-story].glow { animation: breathe 6s linear infinite; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <filter id="g" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
</defs>
<rect width="64" height="64" rx="14" fill="#0f141b"/>
<!-- glow: a blurred duplicate of the green flight, breathing in the resolution beat -->
<g class="glow" data-story="beat-4" opacity="0" filter="url(#g)">
  <rect x="22" y="26" width="9" height="26" rx="2" fill="#22c55e"/>
  <rect x="34" y="34" width="9" height="18" rx="2" fill="#22c55e"/>
  <rect x="46" y="42" width="9" height="10" rx="2" fill="#22c55e"/>
</g>
<!-- the red bar: the bag. Grows to the whole bag at the trigger, drops back to half of it as the flight splits out -->
<rect x="10" y="18" width="9" height="34" rx="2" fill="#ef4444">
  <animate attributeName="y"      dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.2 .8 .2 1;0 0 1 1;.2 .8 .2 1;0 0 1 1;0 0 1 1" keyTimes="0;.10;.22;.30;.42;.96;1" values="18;18;6;6;18;18;18"/>
  <animate attributeName="height" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.2 .8 .2 1;0 0 1 1;.2 .8 .2 1;0 0 1 1;0 0 1 1" keyTimes="0;.10;.22;.30;.42;.96;1" values="34;34;46;46;34;34;34"/>
</rect>
<!-- the red-day cell above the halved bar (beat 3) -->
<rect x="10" y="9" width="9" height="4" rx="1.2" fill="#ef4444" data-story="beat-3" opacity="0">
  <animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;.10;.44;.50;.90;.97;1" values="0;0;0;1;1;0;0"/>
</rect>
<!-- the green flight: sinks at the trigger, rises back staggered left→right as the bag splits -->
<rect x="22" y="26" width="9" height="26" rx="2" fill="#22c55e">
  <animate attributeName="y"      dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.2 .8 .2 1;0 0 1 1;.2 .8 .2 1;0 0 1 1;0 0 1 1" keyTimes="0;.10;.22;.30;.40;.96;1" values="26;26;52;52;26;26;26"/>
  <animate attributeName="height" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.2 .8 .2 1;0 0 1 1;.2 .8 .2 1;0 0 1 1;0 0 1 1" keyTimes="0;.10;.22;.30;.40;.96;1" values="26;26;0;0;26;26;26"/>
</rect>
<rect x="34" y="34" width="9" height="18" rx="2" fill="#22c55e">
  <animate attributeName="y"      dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.2 .8 .2 1;0 0 1 1;.2 .8 .2 1;0 0 1 1;0 0 1 1" keyTimes="0;.10;.22;.36;.46;.96;1" values="34;34;52;52;34;34;34"/>
  <animate attributeName="height" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.2 .8 .2 1;0 0 1 1;.2 .8 .2 1;0 0 1 1;0 0 1 1" keyTimes="0;.10;.22;.36;.46;.96;1" values="18;18;0;0;18;18;18"/>
</rect>
<rect x="46" y="42" width="9" height="10" rx="2" fill="#22c55e">
  <animate attributeName="y"      dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.2 .8 .2 1;0 0 1 1;.2 .8 .2 1;0 0 1 1;0 0 1 1" keyTimes="0;.10;.22;.42;.52;.96;1" values="42;42;52;52;42;42;42"/>
  <animate attributeName="height" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.2 .8 .2 1;0 0 1 1;.2 .8 .2 1;0 0 1 1;0 0 1 1" keyTimes="0;.10;.22;.42;.52;.96;1" values="10;10;0;0;10;10;10"/>
</rect>
<!-- the "now" tick under today: the trigger's colour, visible at t=0 -->
<rect x="10" y="54.5" width="9" height="1.5" rx=".75" fill="#38bdf8" opacity=".9"/>
</svg>
