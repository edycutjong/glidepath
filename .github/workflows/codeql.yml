name: "CodeQL"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      # Code scanning uploads need a public repo (or GHAS). The repo is private until submission day, so the analysis
      # runs and its SARIF is kept as an artifact; the upload switches itself on the moment the repo flips public.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
          output: sarif-results

      - name: Keep the SARIF as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: codeql-sarif
          path: sarif-results
          retention-days: 14
